<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso Panel MPAZ RFID</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <main>

        <h1>Panel MPAZ RFID</h1>

        <p>
            Acceso al sistema de asistencia escolar
        </p>

        <form id="login-form">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Ingresar
            </button>

            <p id="mensaje-login"></p>
        </form>

    </main>

    <script src="/login.js"></script>

</body>

</html>
