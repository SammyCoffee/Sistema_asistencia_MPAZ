<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso Panel MPAZ RFID</title>

    <link rel="stylesheet" href="/styles.css?v=13">
    <link rel="stylesheet" href="/identidad-mpaz.css?v=2">
</head>

<body class="mpaz-login-admin">

    <main>

        <img class="mpaz-sello mpaz-escudo" src="/escudo-mpaz.webp" width="60" height="60" alt="Escudo de la escuela">
        <p class="mpaz-etiqueta">ESCUELA ESCRITORA MARCELA PAZ</p>
        <h1>Acceso administrativo</h1>

        <p>
            Acceso al sistema de asistencia escolar
        </p>

        <form id="login-form">

            <label for="usuario">Usuario</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                autocomplete="username"
                maxlength="40"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Ingresar
            </button>

            <p id="mensaje-login"></p>
        </form>

        <p style="margin-top: 20px; text-align: center;">
            <a
                href="/inicio.html"
                class="enlace-volver-inicio"
                style="color: #1677b8; font-weight: 600;
                       text-decoration: none;"
            >
                ← Volver a selección de portales
            </a>
        </p>

    </main>

    <script src="/identidad-mpaz.js?v=2"></script>
    <script src="/login.js?v=2"></script>

</body>

</html>
